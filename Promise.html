<body>
<script>
    function hi(age)
    {
        return new Promise((resolve,reject)=>
    {
        if(age>=13&&age<=19)
        resolve("You are a teen");
    else
    reject("You are not a teen")
    })
    }
    hi(20)
    .then((result)=> {
        alert(result);
    })
    .catch((err)=>{
        alert(err)
    })
    .finally(()=>{
        alert("Have a happy life");
    })
</script>
