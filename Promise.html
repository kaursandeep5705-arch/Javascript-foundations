<!DOCTYPE html>
<html lang="en">
<body>
<script>
    function check (marks){
        return new Promise((resolve, reject)=>{
            if(marks>33)
        {
            resolve("Congratulations , You have passed ")
        }
        else{
            reject("Fail")
        }
        });
    }
check(100)
.then((result)=>{
alert(result)})
.catch((err)=>{
    alert(err)})
    .finally(()=>{
        alert("Result declared")})
</script>    
</body>
</html>
