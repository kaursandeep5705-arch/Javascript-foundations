<!DOCTYPE html>
<html lang="en">
    <head>
         <style>
        #abc {
            border-style: ridge;  
            border-width: 5px;     
            border-color: black; 
            padding: 8px;          
            border-radius: 4px;    
            outline: none;         
        }
    </style>
    </head>
<body>
    <input type="password" id="abc" placeholder="Enter the password" >
    <button id="btn">Submit</button>
    <script>
        const pword="hello";
        document.getElementById("abc").addEventListener("keypress", (event) => {
            if (event.key === "Enter") {
                document.getElementById("btn").click();
            }
        });
        document.getElementById("btn").addEventListener("click",()=>{
            const pass=document.getElementById("abc").value;
        if(pword==pass){
        const url = "https://jsonplaceholder.typicode.com/users";
        let a={
            name:"John"
        }
        let fd={
            method:"POST",
            body:JSON.stringify(a),
            headers: new Headers({
                Authentication:pass,
                "Content-Type":"application/json ; charset=UTF-8"
            })
        }
        fetch(url,fd).then((response)=>{
            console.log(response.json())
        })}
        else{
            alert("Wrong password")
        }
                })

    </script>
</body>
</html>
