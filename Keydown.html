<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
function checkquantity(e) 
{
if ((e.key > 64 && e.key < 91) || (e.key > 96 && e.key < 123)) 
{
return false;
} else {
return true;
}
}
function printbill() 
{
var itemname = document.getElementById("itemname").value;
var quantity = document.getElementById("quantity").value;
if (itemname == "Coffee") 
{
document.write("Amount " + quantity * 20);
}
if (itemname == "Pizza") 
{
document.write("Amount " + quantity * 100);
}
if (itemname == "Tea") 
{
document.write("Amount " + quantity * 10);
}
}
</script>
</head>
<body>
<h1>Restaurant Bill</h1>
<ul>
<li>Coffee - 20</li>
<li>Pizza - 100</li>
<li>Tea - 10</li>
</ul>
<form>
Item Name
<input type="text" id="itemname" name="itemname" />
Quantity
<input type="text" id="quantity" name="quantity" onkeydown=" return checkquantity(event)" />
<input type="button" onclick="printbill()" value="Print Bill" />
</form>
</body>
</html>
