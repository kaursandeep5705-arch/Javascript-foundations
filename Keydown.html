<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
function setfocuscolor1() 
{
document.getElementById("myname").style.backgroundColor = "#ccffdd";
}
function setfocuscolor2() 
{
document.getElementById("mycourse").style.backgroundColor = "#ccffdd";
}
</script>
</head>
<body>
Name
<input type="text" id="myname" name="myname" onfocus="setfocuscolor1()" />
Course Name 
<input type="text" id="mycourse" onfocus="setfocuscolor2()" />
</body>
</html>
