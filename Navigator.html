<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
function navi() {
document.write(navigator.appName);
document.write("<br>");
document.write(navigator.appVersion);
}
</script>
</head>
<body>
<form>
<input type="button" onclick="navi()" value="Browser Properties" />
</form>
</body>
</html
