<!DOCTYPE html>
<html lang="en">
<body>
    <script>
    const url = "https://dummyjson.com/users/add";
    let data = {
        firstName: "Kabir",
        lastName: "Ovi",
        age: 250,
        };
        let request = new Request(url, {
            method: "POST",
            body: JSON.stringify(data),
            headers: new Headers({
                "Content-Type": "application/json; charset=UTF-8",
                }),
                });
                fetch(request).then((response) => {
                    console.log(response.json());
                    });
    </script>
</body>
</html>
