<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        nav{

            height:600px;
            width:40%;
            text-align: center;
            float:left;
        }
        section{
            background-color: lightgray;
            width:60%;
            height:300px;
            float:right;
        }
        article{
            background-color: blue;
            width:40%;
            float:left;
            height:220px;

        }
        aside{
            background-color: lightpink;

            border:2px solid antiquewhite;
        }
        .abc{
            height:100px;
            margin-top:30px;
            margin-right:50px;
        }
        .abc2{
            height:220px;
            margin:10px;
            margin-right:50px;
            margin-top:30px;
        }
    </style>
</head>
<body>
    <nav>nav</nav>
    <section><div>Section</div>
        <article>Article</article>
        <aside class="abc">Aside</aside>
        <aside class="abc">Aside</aside>
    </section>
    <section><div>Section</div>
        <article>Article</article>
        <aside class="abc2">Aside</aside>
    </section>
</body>
</html>
